name: Translation readiness preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-review-translator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/translation_preflight.py
