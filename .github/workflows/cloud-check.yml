name: Cloud queue check
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: europe-channel-cloud-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python scripts/verify_config.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_cloud_check.py
      - run: |
          git config user.name 'Europe Channel Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet || git commit -m 'Refresh queue dashboard'
          git push
