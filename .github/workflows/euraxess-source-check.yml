name: EURAXESS official source check

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */6 * * *'

permissions:
  contents: write

concurrency:
  group: europe-channel-state
  cancel-in-progress: false

jobs:
  review-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/source_health.py
      - run: python scripts/dashboard.py
      - run: |
          git config user.name 'Europe Channel Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/source-health.json
          git diff --cached --quiet || git commit -m 'Refresh official source health'
          git pull --rebase origin main
          git push
