name: Official review pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: europe-channel-state
  cancel-in-progress: false

jobs:
  collect-translate-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/review_pipeline.py
      - run: python scripts/auto_publish.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      - run: |
          git config user.name 'Europe Channel Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/queue.sqlite3 data/operations.jsonl
          git add docs/index.html
          git diff --cached --quiet || git commit -m 'Refresh official review queue'
          git pull --rebase origin main
          git push
